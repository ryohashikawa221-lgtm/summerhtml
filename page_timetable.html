<!-- ② TIMETABLE -->
<div class="page" id="pg-timetable">
  <div style="padding:12px 16px;background:#fff;border:1px solid var(--border);border-top:3px solid var(--navy);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div style="font-size:13px;color:var(--muted)">選択中の講座を全ターム表示</div>
    <div style="display:flex;align-items:center;gap:16px">
      <div style="font-family:'Shippori Mincho',serif;font-size:18px;color:var(--navy)">全員合計 <strong id="tt-total">$0</strong></div>
      <button class="btn btn-outline btn-sm" onclick="printTimetable()">🖨 時間割を印刷</button>
    </div>
  </div>
  <!-- 生徒切替タブ（複数生徒時のみ表示） -->
  <div id="tt-student-tabs" style="display:none;background:#fff;border:1px solid var(--border);padding:8px 12px;margin-bottom:10px;flex-wrap:wrap;gap:6px;align-items:center">
    <span style="font-size:11px;color:var(--muted);margin-right:6px">表示切替:</span>
  </div>
  <div id="tt-content"></div>
</div>
