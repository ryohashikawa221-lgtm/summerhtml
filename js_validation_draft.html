<script>
// PHASE U-1 / FEATURE D: 入力バリデーション強化
// ============================================================
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const TEL_ALLOWED_RE = /[^\d\-\(\)\s\+]/g;

function validateParent(){
  const el=document.getElementById('f-parent');
  const errEl=document.getElementById('err-parent');
  if(!el||!errEl) return;
  // 入力済みかつ trim 後に空(空白文字のみ)はエラー
  if(el.value.length>0 && el.value.trim().length===0){
    errEl.textContent='代表保護者氏名を入力してください';
    errEl.style.display='block';
  } else {
    errEl.textContent='';
    errEl.style.display='none';
  }
}

function validateEmail(){
  const el=document.getElementById('f-email');
  const errEl=document.getElementById('err-email');
  if(!el||!errEl) return;
  const v=el.value.trim();
  if(v && !EMAIL_RE.test(v)){
    errEl.textContent='メールアドレスの形式が正しくありません';
    errEl.style.display='block';
  } else {
    errEl.textContent='';
    errEl.style.display='none';
  }
}

function formatTel(){
  const el=document.getElementById('f-tel');
  if(!el) return;
  const cleaned=el.value.replace(TEL_ALLOWED_RE,'');
  if(cleaned!==el.value){
    const pos=el.selectionStart;
    el.value=cleaned;
    try{ el.setSelectionRange(pos-1,pos-1); }catch(e){}
  }
}

// 学年テキストと対象区分(level)の整合性チェック。明確に矛盾するときのみ true。
function gradeLevelMismatch(grade, level){
  if(!grade||!level) return false;
  const g=String(grade).replace(/\s/g,'');
  const detect={
    elem_lo:/小(学(校)?)?[1-3１-３一二三]/,
    elem_hi:/小(学(校)?)?[4-6４-６四五六]/,
    jhs:/中(学(校|生)?)?[1-3１-３一二三]/,
    hs:/高(校|等学校)?[1-3１-３一二三]/
  };
  const re=detect[level];
  if(re && re.test(g)) return false;
  // 自レベルと一致しない、かつ他レベルとは明確に一致 → 不整合
  for(const lv of Object.keys(detect)){
    if(lv!==level && detect[lv].test(g)) return true;
  }
  return false;
}

// ============================================================
// PHASE U-1 / FEATURE A: 途中保存・再開機能
// ============================================================
const DRAFT_KEY='summer2026_draft_v1';
const DRAFT_VERSION=1;
const DRAFT_TTL_MS=30*24*60*60*1000; // 30日

let _draftSaveTimer=null;
let _draftRestoreInProgress=false;

function _draftStorageAvailable(){
  try{
    const k='__draft_probe__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){
    return false;
  }
}

function saveDraftDebounced(){
  if(_draftRestoreInProgress) return;
  if(_draftSaveTimer) clearTimeout(_draftSaveTimer);
  _draftSaveTimer=setTimeout(saveDraftNow,500);
}

// 自動保存インジケータの一時表示（保存後3秒間表示）
let _autoSaveIndicatorTimer=null;
function showAutoSaveIndicator(){
  const el=document.getElementById('auto-save-indicator');
  if(!el) return;
  const t=new Date();
  const tStr=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
  el.textContent='✓ '+tStr+' 自動保存しました';
  el.style.display='inline';
  if(_autoSaveIndicatorTimer) clearTimeout(_autoSaveIndicatorTimer);
  _autoSaveIndicatorTimer=setTimeout(()=>{ el.style.display='none'; },3000);
}

// 必須項目進捗バーの更新
function updateProgressBar(){
  const fill=document.getElementById('progress-bar-fill');
  const text=document.getElementById('progress-text');
  if(!fill||!text) return;
  // 必須項目チェック（5項目）
  const checks=[
    !!(document.getElementById('f-parent')?.value||'').trim(),                            // 保護者氏名
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((document.getElementById('f-email')?.value||'').trim()), // 有効メール
    !!(document.getElementById('f-tel')?.value||'').trim(),                               // 電話番号
    students.some(s=>!!(s.name||'').trim()&&!!s.grade&&!!s.level),                        // 1人以上の生徒情報
    students.some(s=>s.courses.length>0||s.preSlots.length>0)                             // 1コース以上選択
  ];
  const done=checks.filter(Boolean).length;
  const total=checks.length;
  const pct=Math.round((done/total)*100);
  fill.style.width=pct+'%';
  text.textContent=done+'/'+total;
  // 全部完了したら緑色強調
  text.style.color=done===total?'#22c55e':'var(--navy)';
}

function saveDraftNow(){
  try{
    const payload={
      _v:DRAFT_VERSION,
      ts:Date.now(),
      students:students,
      activeStudent:activeStudent,
      parent:{
        name:document.getElementById('f-parent')?.value||'',
        email:document.getElementById('f-email')?.value||'',
        tel:document.getElementById('f-tel')?.value||'',
        emergencyTel:document.getElementById('f-emergency-tel')?.value||'',
        emergencyRel:document.getElementById('f-emergency-rel')?.value||'',
        note:document.getElementById('f-note')?.value||''
      }
    };
    localStorage.setItem(DRAFT_KEY,JSON.stringify(payload));
    // 自動保存インジケータを更新
    if(typeof showAutoSaveIndicator==='function') showAutoSaveIndicator();
  }catch(e){
    // localStorage 無効環境(プライベートブラウジング等)では無視
    console.warn('[draft] save skipped:',e&&e.message);
  }
}

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

// 前年度の保護者情報（送信成功時に保存、次回訪問時に自動復元）
const PREV_PARENT_KEY='summer_prev_parent_v1';
function savePrevParent(){
  try{
    const data={
      name:document.getElementById('f-parent')?.value||'',
      email:document.getElementById('f-email')?.value||'',
      tel:document.getElementById('f-tel')?.value||'',
      emergencyTel:document.getElementById('f-emergency-tel')?.value||'',
      emergencyRel:document.getElementById('f-emergency-rel')?.value||'',
      ts:Date.now()
    };
    localStorage.setItem(PREV_PARENT_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadPrevParent(){
  try{
    const raw=localStorage.getItem(PREV_PARENT_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}
// 新規セッション時に前年度の保護者情報を提案フィルイン（ユーザーが空欄の場合のみ）
function fillPrevParentIfEmpty(){
  const prev=loadPrevParent();
  if(!prev) return;
  const setIfEmpty=(id,v)=>{
    const el=document.getElementById(id);
    if(el&&!el.value&&v) el.value=v;
  };
  setIfEmpty('f-parent',prev.name);
  setIfEmpty('f-email',prev.email);
  setIfEmpty('f-tel',prev.tel);
  setIfEmpty('f-emergency-tel',prev.emergencyTel);
  setIfEmpty('f-emergency-rel',prev.emergencyRel);
}

function loadDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(!raw) return null;
    const data=JSON.parse(raw);
    if(!data||data._v!==DRAFT_VERSION) return null;
    if(!data.ts||Date.now()-data.ts>DRAFT_TTL_MS){
      clearDraft();
      return null;
    }
    if(!Array.isArray(data.students)||data.students.length===0) return null;
    return data;
  }catch(e){
    return null;
  }
}

function _showRestoreModal(savedAt){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    const ts=new Date(savedAt).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    overlay.innerHTML=
      '<div style="background:#fff;max-width:420px;width:100%;border-radius:6px;border-top:4px solid #c9a84c;padding:24px;font-family:inherit;box-shadow:0 12px 40px rgba(0,0,0,0.25)">'+
        '<div style="font-family:\'Shippori Mincho\',serif;font-size:18px;color:#1b2a4a;margin-bottom:12px">📝 入力中の内容があります</div>'+
        '<div style="font-size:13px;color:#555;line-height:1.7;margin-bottom:18px">'+
          '前回入力中の内容が保存されています。<br>'+
          '<span style="color:#888;font-size:11px">保存日時：'+ts+'</span><br><br>'+
          '続きから再開しますか？'+
        '</div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'+
          '<button id="draft-discard" style="padding:8px 18px;background:#fff;border:1px solid #ccc;color:#666;font-family:inherit;font-size:12px;cursor:pointer;border-radius:3px">破棄して新規</button>'+
          '<button id="draft-restore" style="padding:8px 18px;background:#c9a84c;border:1px solid #c9a84c;color:#fff;font-family:inherit;font-size:12px;cursor:pointer;border-radius:3px;font-weight:700">復元する</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#draft-restore').onclick=()=>{ document.body.removeChild(overlay); resolve(true); };
    overlay.querySelector('#draft-discard').onclick=()=>{ document.body.removeChild(overlay); resolve(false); };
  });
}

async function tryRestoreDraft(){
  if(!_draftStorageAvailable()){
    // localStorage 利用不可 → 通常起動のみ
    addStudent();
    return;
  }
  const draft=loadDraft();
  if(!draft){ addStudent(); return; }
  const wantRestore=await _showRestoreModal(draft.ts);
  if(!wantRestore){
    clearDraft();
    addStudent();
    return;
  }
  _draftRestoreInProgress=true;
  try{
    // 構造ガード：必須キーが欠けていれば破棄して新規
    const restored=draft.students.map(s=>({
      id:s.id||0,
      name:s.name||'',
      grade:s.grade||'',
      level:s.level||'',
      schoolDisc:!!s.schoolDisc,
      courses:Array.isArray(s.courses)?s.courses:[],
      preSlots:Array.isArray(s.preSlots)?s.preSlots:[],
      courseDetails:s.courseDetails||{},
      preDetails:s.preDetails||{},
      zoomCourses:Array.isArray(s.zoomCourses)?s.zoomCourses:[],
      zoomType:s.zoomType||{},
      zoomScope:s.zoomScope||{},
      zoomDates:s.zoomDates||{}
    }));
    students=restored;
    activeStudent=Math.min(Math.max(0,draft.activeStudent||0),students.length-1);
    const maxId=students.reduce((m,s)=>Math.max(m,s.id||0),0);
    nextSid=Math.max(nextSid,maxId+1);
    if(draft.parent){
      const setVal=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v||''; };
      setVal('f-parent',draft.parent.name);
      setVal('f-email',draft.parent.email);
      setVal('f-tel',draft.parent.tel);
      setVal('f-emergency-tel',draft.parent.emergencyTel);
      setVal('f-emergency-rel',draft.parent.emergencyRel);
      setVal('f-note',draft.parent.note);
    }
  }catch(e){
    console.warn('[draft] restore failed:',e&&e.message);
    clearDraft();
    students=[];
    addStudent();
    _draftRestoreInProgress=false;
    return;
  }
  _draftRestoreInProgress=false;
  renderStudents();
  updateAll();
  validateParent();
  validateEmail();
  formatTel();
}

// 親フォームの入力ハンドラ（バリデーション + 下書き保存）
(function attachParentFieldListeners(){
  const map=[
    ['f-parent', validateParent],
    ['f-email',  validateEmail],
    ['f-tel',    formatTel],
    ['f-note',   null]
  ];
  map.forEach(([id,fn])=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('input',()=>{
      if(fn) fn();
      saveDraftDebounced();
      if(typeof updateProgressBar==='function') updateProgressBar();
    });
    el.addEventListener('blur',()=>{ if(fn) fn(); });
  });
  // 初回描画
  if(typeof updateProgressBar==='function') updateProgressBar();
})();


</script>
